<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Página Inicial</title>
</head>
<body>
    <div class="container">
    <h1>Boas Vindas!</h1>
    <p>Vamos personalizar sua saudação usando Javascript</p>
    <div class="saudacao" id="mensagemSaudacao">Olá Visitante!</div>
<button onClick="mudarNome()">Personalizar Botão</button>   
</div>


    <script>
        function mudarNome(){
            let nome = "Anderson"
             document.getElementById("mensagemSaudacao").textContent = "Olá " + nome
        }
   
    </script>
</body>
</html>
